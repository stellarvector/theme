baseURL: "https://localhost:1313/"
title: "Stellar Vector Gallery"

disableKinds:
  - taxonomy
  - term
  - RSS
  - sitemap
  - robotsTXT

params:
  host: "example"
  analytics:
    website_id: ""
    domains: "localhost"
  css:
    extra:
      - "css/chroma.css"
      - "css/gallery.css"
  external_links:
    - title: "Main Site"
      url: "https://stellarvector.be"
    - title: "Blog"
      url: "https://blog.stellarvector.be"

menu:
  main:
    - name: "home"
      url: "/"
      weight: 1
    - name: "about"
      url: "/#typography"
      weight: 2
    - name: "components"
      url: "/#components"
      weight: 3

security:
  exec:
    allow:
      - '^(dart-)?sass$'
      - '^go$'
      - '^git$'
      - '^node$'
      - '^postcss$'
      - '^tailwindcss$'

build:
  buildStats:
    enable: true
  cachebusters:
  - source: 'assets/notwatching/hugo_stats\.json'
    target: css
  - source: '(postcss|tailwind)\.config\.js'
    target: css

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

module:
  imports:
    - path: "github.com/stellarvector/theme"
  mounts:

    - source: assets
      target: assets
    - source: scripts
      target: scripts
    - source: layouts
      target: layouts
    - source: static
      target: static
    - disableWatch: true
      source: hugo_stats.json
      target: assets/notwatching/hugo_stats.json
