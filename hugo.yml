name: "Stellar Vector Theme"
description: "Central theme for Stellar Vector sites"
homepage: "https://github.com/stellarvector/theme#readme"
min_hugo_version: "0.165.0"

author:
  name: "Stellar Vector"
  homepage: "https://stellarvector.be"


params:
  theme_color_light: "#fff9f9"
  theme_color_dark: "#0a0505"

  measure: "5xl"
  host: ""          # REQUIRED per site: www | blog | find
  sites:
    - name: "www"
      url: "https://www.stellarvector.be"
    - name: "blog"
      url: "https://blog.stellarvector.be"
    - name: "play"
      url: "https://play.stellarvector.be"
    - name: "find"
      url: "https://find.stellarvector.be"

  logo:
    dark: "/assets/logo/logo-dark.png"
    light: "/assets/logo/logo-light.png"
    star: "/assets/logo/star.png"

  analytics:
    script: "https://go.stellarvector.be/go.js"
    website_id: ""  # REQUIRED per site
    domains: ""     # REQUIRED per site

  credit:
    org: "Stellar Vector"
    parents:
      - name: "DistriNet research group"
        url: "https://distrinet.cs.kuleuven.be"
      - name: "KU Leuven"
        url: "https://www.kuleuven.be"
    loko_url: "https://www.loko.be/en/societies"

  # The canonical identity list: which accounts are ours. find's
  # data/links/*.yml stays separate -- that carries copy, ordering, per-
  # destination UTM tags and analytics event ids, which is content.
  social:
    github: "https://www.github.com/stellarvector"
    discord: "https://discord.gg/tbP75TNfNR"
    ctftime: "https://www.ctftime.org/team/192988"
    htb: "https://app.hackthebox.com/teams/overview/4886"
    linkedin: "https://www.linkedin.com/company/stellarvector/"
    x: "https://x.com/stellar_vector"
    facebook: "https://www.facebook.com/stellarvector.be"
    instagram: "https://www.instagram.com/stellar.vector"
    email:     "https://groups.google.com/a/stellarvector.be/g/ctf"

markup:
  highlight:
    noClasses: false

module:
  mounts:
    - source: core/assets
      target: assets
    - source: core/static
      target: static

    - source: hugo/assets
      target: assets
    - source: hugo/layouts
      target: layouts