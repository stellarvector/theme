{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-md px-4 py-12 sm:py-20">
    <div class="sv-terminal p-6 sm:p-8">
        <div class="flex items-center justify-between mb-8">
            <h2 class="sv-marker text-2xl">
                <span class="sv-glitch sv-glitch-auto" data-text="Register">Register</span>
            </h2>
            <span class="font-mono text-xs text-muted opacity-50">v1.0.4-provision</span>
        </div>

        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="mb-6 rounded-sm border border-accent/30 bg-accent/5 p-4 text-sm text-accent-light font-mono">
                        <span class="text-accent mr-2">!</span> {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="post" accept-charset="utf-8" autocomplete="off" class="flex flex-col gap-6">
            <div class="flex flex-col gap-2">
                <label for="name" class="sv-label text-muted">User Name</label>
                <input class="w-full rounded-sm border border-line-strong bg-surface px-4 py-2.5 font-mono text-sm text-body transition-colors focus:border-accent focus:outline-none placeholder:text-muted/30" 
                       id="name" name="name" type="text" value="" placeholder="alias" required>
            </div>

            <div class="flex flex-col gap-2">
                <label for="email" class="sv-label text-muted">Email</label>
                <input class="w-full rounded-sm border border-line-strong bg-surface px-4 py-2.5 font-mono text-sm text-body transition-colors focus:border-accent focus:outline-none placeholder:text-muted/30" 
                       id="email" name="email" type="email" value="" placeholder="operator@stellarvector.be" required>
            </div>
            
            <div class="flex flex-col gap-2">
                <label for="password" class="sv-label text-muted">Password</label>
                <input class="w-full rounded-sm border border-line-strong bg-surface px-4 py-2.5 font-mono text-sm text-body transition-colors focus:border-accent focus:outline-none" 
                       id="password" name="password" type="password" value="" required>
            </div>

            <input type="hidden" name="nonce" value="{{ Session.nonce }}">

            <button type="submit" class="group mt-2 font-mono font-bold no-underline inline-flex items-center justify-center gap-2.5 min-h-11 transition-colors duration-200 rounded-sm bg-accent text-accent-text! hover:bg-accent-dark active:scale-95 py-2.5 px-6">
                <span>Provision Account</span>
                <span class="sv-caret-static opacity-50"></span>
            </button>
        </form>

        <div class="mt-10 pt-6 border-t border-line text-center">
            <p class="text-sm text-muted">
                Already registered? 
                <a href="{{ url_for('auth.login') }}" class="text-link hover:text-link-hover font-bold">Authenticate</a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
