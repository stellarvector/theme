{% from "macros/icons.html" import icon %}

<section class="relative overflow-hidden border-b border-line-strong">
    {# Decorative coordinate grid, faded at the edges. #}
    <div class="sv-grid sv-grid-fade pointer-events-none absolute inset-0 opacity-60" aria-hidden="true"></div>

    <div class="relative mx-auto w-full max-w-5xl px-4 py-12 sm:px-6 sm:py-16">
        <p class="sv-label sv-prompt normal-case">{% block hero_prompt %}whoami{% endblock %}</p>

        <h1 class="sv-marker !mt-0 !mb-4">
            <span class="sv-glitch sv-glitch-auto" data-text="{% block hero_title %}{{ Config.ctf_name }}{% endblock %}">{% block hero_title_text %}{{ Config.ctf_name }}{% endblock %}</span>
        </h1>

        <p class="mt-4 max-w-2xl text-base text-muted text-pretty sm:text-lg">
            {% block hero_subtitle %}{% endblock %}<span class="sv-caret" aria-hidden="true"></span>
        </p>

        {% block hero_extra %}{% endblock %}
    </div>
</section>
