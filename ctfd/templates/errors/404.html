{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-5xl px-4 py-20 sm:py-32 flex flex-col items-center text-center">
    <div class="sv-terminal p-8 mb-8 inline-block">
        <p class="font-mono text-6xl font-bold text-accent mb-4">404</p>
        <p class="sv-label text-muted">Sector Not Found: Target Unavailable</p>
    </div>
    <div class="prose text-muted mb-12 font-mono text-sm leading-relaxed">
        <p>The coordinates you provided do not correspond to any known assets in the Stellar Vector database.</p>
    </div>
    <a href="/" class="group font-mono font-bold no-underline! hover:no-underline! bg-accent text-accent-text! hover:bg-accent-dark active:scale-95 py-3.5 px-10 rounded-sm transition-all duration-200 flex items-center gap-3">
        <span class="text-accent-text! opacity-50">$</span>
        <span>return to base</span>
    </a>
</div>
{% endblock %}
