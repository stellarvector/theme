{% extends "base.html" %}

{% block content %}
<div class="mx-auto max-w-5xl px-4 py-20 sm:py-32 flex flex-col items-center text-center">
    <div class="sv-terminal p-8 mb-8 inline-block">
        <h1 class="font-mono text-7xl font-bold text-accent mb-4 tracking-tighter">
            <span class="sv-glitch sv-glitch-auto" data-text="404">404</span>
        </h1>
        <p class="sv-label text-accent-light/80 border-t border-accent/20 pt-4 px-8">
            Segment Violation: Resource not found
        </p>
    </div>
    
    <div class="max-w-md mx-auto mb-12">
        <p class="text-muted text-lg font-mono">
            The requested sector does not exist or has been decommissioned. 
            Check your coordinates and try again.
        </p>
    </div>

    <a href="/" class="group font-mono font-bold bg-accent text-accent-text! hover:bg-accent-dark active:scale-95 py-3.5 px-10 rounded-sm transition-all duration-200 flex items-center gap-3">
        <span class="text-accent-text! opacity-50">$</span>
        <span>RETURN TO BASE</span>
    </a>
</div>
{% endblock %}
